# Example: Envoy Gateway with TLS + IP (HTTPS)
#
# The chart creates the Gateway (HTTP + HTTPS listeners), the Harbor HTTPRoute
# and an HTTP->HTTPS redirect. No manual post-install editing required.
#
# Usage:
#   helm install otterscale -n otterscale-system --create-namespace ./ \
#     -f examples/envoy-values-domain-name.yaml

dashboard:
  externalURL: "https://10.102.197.210"                ## Envoy LB IP

server:
  externalURL: "https://10.102.197.210/api/"           ## Envoy LB IP
  externalTunnelURL: "https://10.102.197.214:30300"    ## K8S VIP or Node IP
  tunnelService:
    type: NodePort
    nodePort: "30300"

harbor:
  externalURL: "https://10.102.197.210"                ## Envoy LB IP

ee:
  enabled: true

# 通用 Gateway（零 listener）已先行部署在 otterscale-system;其 EnvoyProxy
# service 此情境設 type: LoadBalancer + loadBalancerIP: "10.102.197.210"。
# 本 chart 以 ListenerSet 提供 80/443 listener 與憑證（都在 release
# namespace），並掛上 HTTPRoute。
envoy:
  enabled: true
  gateway:
    name: "otterscale-gateway"
    namespace: "otterscale-system"
  tls:
    enabled: true
    redirectToHTTPS: true

    # ---- 憑證來源（二選一，皆位於 release namespace）----

    # 方式 A：引用已存在的 Secret
    #   kubectl create secret tls phison-new-2026 \
    #     --cert=tls.crt --key=tls.key -n <release-namespace>
    existingSecret: "phison-new-2026"

    # 方式 B：直接貼上憑證，由 chart 自動建立 Secret（留空 existingSecret 即用此）
    # crt: |
    #   -----BEGIN CERTIFICATE-----
    #   ...貼上 tls.crt (PEM)...
    #   -----END CERTIFICATE-----
    # key: |
    #   -----BEGIN PRIVATE KEY-----
    #   ...貼上 tls.key (PEM)...
    #   -----END PRIVATE KEY-----
