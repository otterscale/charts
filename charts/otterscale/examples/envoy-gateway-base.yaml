# ── Envoy Gateway 基礎層（step 0，安裝 otterscale 之前）──
#
#   helm install envoy-gateway oci://docker.io/envoyproxy/gateway-helm \
#     --version 1.9.0 -n otterscale-system --create-namespace
#   kubectl apply -f envoy-gateway-base.yaml
#
# 本檔資源不屬於任何 helm release，chart 升級永遠碰不到；otterscale/kserve
# 僅以 ListenerSet + HTTPRoute 掛上。otterscale-envoy-gateway chart 用獨立的
# controllerName 與 class（envoy-kserve），與本套完全隔離。
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: otterscale-envoyproxy
  namespace: otterscale-system
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        # NodePort（ip:port）| LoadBalancer（domain，可加 loadBalancerIP patch）
        type: NodePort
        externalTrafficPolicy: Local
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                # otterscale ListenerSet: http
                - name: http
                  port: 80
                  protocol: TCP
                  targetPort: 10080
                  nodePort: 30080
                # otterscale ListenerSet: https（envoy.tls.enabled 時）
                - name: https
                  port: 443
                  protocol: TCP
                  targetPort: 10443
                  nodePort: 30443
                # kserve ListenerSet（同 cluster 模式）
                - name: http-kserve
                  port: 32080
                  protocol: TCP
                  targetPort: 32080
                  nodePort: 32080
                # 僅純 ip:port 要 TLS 分流時使用（預設 kserve 走 443/SNI）：
                # - name: https-kserve
                #   port: 32443
                #   protocol: TCP
                #   targetPort: 32443
                #   nodePort: 32443
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-otterscale
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: otterscale-envoyproxy
    namespace: otterscale-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: otterscale-gateway
  namespace: otterscale-system
spec:
  gatewayClassName: envoy-otterscale
  # 零 listener：所有 listener 由各 chart 的 ListenerSet 提供
  allowedListeners:
    namespaces:
      from: All
