{{- if .Values.envoy.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Values.envoy.listenerSet.name }}
  namespace: {{ include "otterscale.namespace" . }}
  labels:
    {{- include "otterscale.labels" . | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "otterscale.gatewayRef" . }}
    namespace: {{ include "otterscale.gateway.namespace" . }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- if .Values.envoy.tls.enabled }}
    - name: https
      protocol: HTTPS
      port: 443
      {{- with .Values.envoy.tls.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ include "otterscale.tls.secretName" . }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
