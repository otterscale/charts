apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "otterscale.server.fullname" . }}
  labels:
    {{- include "otterscale.server.labels" . | nindent 4 }}
rules:
  - apiGroups: ["management.cattle.io"]
    resources: ["projects"]
    verbs: ["get", "list", "watch"]
