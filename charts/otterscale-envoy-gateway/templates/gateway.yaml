{{- $g := .Values.gateway }}
{{- if $g.create }}
{{- /* Zero-listener Gateway; consumer charts attach listeners via ListenerSet. */}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  allowedListeners:
    namespaces:
      from: All
{{- end }}
