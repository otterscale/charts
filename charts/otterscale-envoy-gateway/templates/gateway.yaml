{{- $g := .Values.gateway }}
{{- if $g.create }}
{{- /* Real listeners come from consumer ListenerSets; the placeholder only
satisfies the CRD's minItems: 1 (never matches, accepts no routes). */}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $g.name }}
  namespace: {{ .Release.Namespace }}
spec:
  gatewayClassName: {{ .Values.gatewayClass.name }}
  allowedListeners:
    namespaces:
      from: All
  listeners:
    - name: placeholder
      protocol: HTTP
      port: 19080
      hostname: "placeholder.invalid"
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
