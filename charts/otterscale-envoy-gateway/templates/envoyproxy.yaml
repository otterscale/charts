{{- $svc := .Values.envoyProxy.service }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: otterscale-envoyproxy
  namespace: {{ .Release.Namespace }}
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: {{ $svc.type }}
        {{- if ne $svc.type "ClusterIP" }}
        externalTrafficPolicy: {{ $svc.externalTrafficPolicy }}
        {{- end }}
        {{- if or $svc.ports (and (eq $svc.type "LoadBalancer") $svc.loadBalancerIP) }}
        patch:
          type: StrategicMerge
          value:
            spec:
              {{- with $svc.ports }}
              ports:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              {{- if and (eq $svc.type "LoadBalancer") $svc.loadBalancerIP }}
              loadBalancerIP: {{ $svc.loadBalancerIP | quote }}
              {{- end }}
        {{- end }}
