metadata:
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
  name: otterscale-httproute-admin
rules:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - "*"
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes/status
    verbs:
      - get
---
