{{- if .Values.gatewayClass.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
spec:
  # Single source of truth: the bundled controller's configured name.
  controllerName: {{ (index .Values "gateway-helm").config.envoyGateway.gateway.controllerName }}
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: otterscale-envoyproxy
    namespace: {{ .Release.Namespace }}
{{- end }}
