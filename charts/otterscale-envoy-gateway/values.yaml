# https://raw.githubusercontent.com/envoyproxy/ai-gateway/v1.0.0/manifests/envoy-gateway-values.yaml
# https://raw.githubusercontent.com/envoyproxy/ai-gateway/v1.0.0/examples/inference-pool/envoy-gateway-values-addon.yaml

gateway-helm:
  deployment:
    pod:
      annotations:
        module.otterscale.io/ai-gateway: enabled
  config:
    envoyGateway:
      gateway:
        controllerName: gateway.envoyproxy.io/gatewayclass-controller
      logging:
        level:
          default: info
      provider:
        type: Kubernetes
      extensionApis:
        # Not strictly required, but recommended for backward/future compatibility.
        enableEnvoyPatchPolicy: true
        # Required: Enable Backend API for AI service backends.
        enableBackend: true
      # Required: AI Gateway needs to fine-tune xDS resources generated by Envoy Gateway.
      extensionManager:
        # Enable InferencePool custom resource support
        backendResources:
          - group: inference.networking.k8s.io
            kind: InferencePool
            version: v1
        hooks:
          xdsTranslator:
            translation:
              listener:
                includeAll: true
              route:
                includeAll: true
              cluster:
                includeAll: true
              secret:
                includeAll: true
            post:
              - Translation
              - Cluster
              - Route
        service:
          fqdn:
            # IMPORTANT: Update this to match your AI Gateway controller service
            # Format: <service-name>.<namespace>.svc.cluster.local
            # Default if you followed the installation steps above:
            hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
            port: 1063

# ── Gateway API shared infrastructure (kserve / AI gateway traffic) ──
# NOTE: the otterscale chart runs its OWN bundled Envoy Gateway controller with
# a different controllerName and class ("envoy-otterscale") — the two stacks
# are fully isolated. Keep this chart's nodePorts distinct from otterscale's
# (default 30080/30443).
gatewayClass:
  create: true
  # Referenced by otterscale-kserve-resource (gateway.className) — keep them
  # in sync.
  name: envoy-kserve

envoyProxy:
  create: true
  logLevel: warn
  replicas: 1
  podDisruptionBudget:
    minAvailable: 0
  service:
    type: NodePort
    externalTrafficPolicy: Local
    loadBalancerIP: ""
    ports:
      - name: http-kserve
        port: 80
        protocol: TCP
        targetPort: 32080
        nodePort: 32080
      - name: https-kserve
        port: 443
        protocol: TCP
        targetPort: 32443
        nodePort: 32443
