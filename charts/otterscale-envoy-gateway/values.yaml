# https://raw.githubusercontent.com/envoyproxy/ai-gateway/v1.0.0/manifests/envoy-gateway-values.yaml
# https://raw.githubusercontent.com/envoyproxy/ai-gateway/v1.0.0/examples/inference-pool/envoy-gateway-values-addon.yaml

gateway-helm:
  deployment:
    pod:
      annotations:
        module.otterscale.io/ai-gateway: enabled
  config:
    envoyGateway:
      gateway:
        # Must differ from the pre-deployed otterscale-system EG (EG default
        # name) so the two controllers never claim each other's GatewayClass.
        controllerName: gateway.envoyproxy.io/envoy-kserve-controller
      logging:
        level:
          default: info
      provider:
        type: Kubernetes
      extensionApis:
        # Not strictly required, but recommended for backward/future compatibility.
        enableEnvoyPatchPolicy: true
        # Required: Enable Backend API for AI service backends.
        enableBackend: true
      # Required: AI Gateway needs to fine-tune xDS resources generated by Envoy Gateway.
      extensionManager:
        # Enable InferencePool custom resource support
        backendResources:
          - group: inference.networking.k8s.io
            kind: InferencePool
            version: v1
        hooks:
          xdsTranslator:
            translation:
              listener:
                includeAll: true
              route:
                includeAll: true
              cluster:
                includeAll: true
              secret:
                includeAll: true
            post:
              - Translation
              - Cluster
              - Route
        service:
          fqdn:
            # IMPORTANT: Update this to match your AI Gateway controller service
            # Format: <service-name>.<namespace>.svc.cluster.local
            # Default if you followed the installation steps above:
            hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
            port: 1063

# ── Gateway API infrastructure (kserve / AI stack) ──
# Generic zero-listener Gateway; consumer charts bring ListenerSet + HTTPRoute.
# The otterscale stack is a SEPARATE pre-deployed EG in otterscale-system
# (see otterscale/examples/envoy-gateway-base.yaml).

gatewayClass:
  create: true
  name: envoy-kserve

gateway:
  create: true
  name: otterscale-gateway

envoyProxy:
  service:
    type: NodePort # NodePort | LoadBalancer | ClusterIP
    externalTrafficPolicy: Local
    loadBalancerIP: "" # LoadBalancer only (e.g. MetalLB)
    # Pin nodePorts here; unpinned listener ports get random NodePorts.
    ports:
      - name: http-kserve
        port: 32080
        protocol: TCP
        targetPort: 32080
        nodePort: 32080

