apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ .Values.listenerSet.name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.listenerSet.port }}
      # llmisvc creates HTTPRoutes in model namespaces
      allowedRoutes:
        namespaces:
          from: All
